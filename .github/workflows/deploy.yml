name: Deploy to Hetzner

on:
  push:
    tags:
      - 'v*'  # Deploy on version tags only
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'test' }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git operations
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Enable pnpm
        run: corepack enable
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      # ========================================
      # Build All Components
      # ========================================
      - name: Install dependencies
        run: pnpm install
      
      - name: Build gateway
        working-directory: apps/gateway
        run: go build -o bin/gateway ./cmd
      
      - name: Build agent
        working-directory: apps/agent
        run: pnpm build
      
      - name: Build web
        working-directory: apps/web
        run: pnpm build
      
      # ========================================
      # Deploy to Hetzner via SSH
      # ========================================
      - name: Deploy to Hetzner server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          password: ${{ secrets.HETZNER_PASSWORD }}
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            cd /opt/aetherspec-v2
            
            # Pull latest changes
            git fetch origin
            git checkout ${{ github.ref_name }}
            
            # Install dependencies
            pnpm install --frozen-lockfile
            
            # Build
            pnpm nx run @aetherspec-app/backend:build
            pnpm nx run @aetherspec-app/frontend:build
            
            # Restart services
            docker compose --env-file .env.prod -f docker-compose.prod.yml down
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            
            # Health check
            sleep 10
            curl -sf http://127.0.0.1:3000/healthz || exit 1
            
            echo "✅ Deployment complete!"
      
      # ========================================
      # Verify Deployment
      # ========================================
      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Check health endpoint
          curl -sf https://api.aetherspec.ai/healthz && echo "✅ Gateway healthy" || exit 1
          
          echo "🎉 Deployment verified successfully!"
