name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # Go Gateway Build & Test
  # ========================================
  gateway-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o bin/gateway ./cmd

      - name: Test
        run: go test -v ./...

      - name: Lint
        run: |
          go install golang.org/x/lint/golint@latest
          golint ./...

  # ========================================
  # Agent Sidecar Build & Test
  # ========================================
  agent-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test || true # Skip tests for foundation phase

  # ========================================
  # Web App Build & Test
  # ========================================
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint || true # Skip for foundation phase

  # ========================================
  # Monorepo Root Checks
  # ========================================
  monorepo-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install root dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Turbo build (all workspaces)
        run: pnpm build

  # ========================================
  # Docker Compose Validation
  # ========================================
  docker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/docker-compose

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          echo "✅ docker-compose.yml is valid"
